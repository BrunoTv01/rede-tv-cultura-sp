# Rede TV Cultura SP com PostgreSQL. Jeito mais fácil (instala o Docker, cria o .env, configura o Grafana):
#   curl -fsSL https://raw.githubusercontent.com/BrunoTv01/rede-tv-cultura-sp/main/instalar-docker.sh | sudo bash
# Ou, com o código já baixado:
#   docker compose up -d
# Abra http://IP-DO-SERVIDOR:3100  ·  login admin / senha admin (troca no 1º acesso)
#
# Opcional: crie um arquivo .env (veja .env.example) para escolher a senha inicial ou a porta.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_DB: redetv
      POSTGRES_USER: redetv
      # o banco não fica exposto fora do Docker; só o sistema fala com ele
      POSTGRES_PASSWORD: ${DB_PASSWORD:-redetv-rede-interna}
    volumes:
      - redetv-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redetv -d redetv"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: rede-tv-cultura-app
    restart: unless-stopped
    logging: *logs
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://redetv:${DB_PASSWORD:-redetv-rede-interna}@db:5432/redetv
      # vazio = senha inicial "admin"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # opcional: redefine a senha do admin ao iniciar (uma vez por valor)
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-}
      # opcional: Grafana (também dá para configurar pela página, no menu do admin)
      GRAFANA_URL: ${GRAFANA_URL:-}
      GRAFANA_TOKEN: ${GRAFANA_TOKEN:-}
      GRAFANA_DASHBOARD: ${GRAFANA_DASHBOARD:-}
      TELEMETRIA_URL: ${TELEMETRIA_URL:-}
      TELEMETRIA_TOKEN: ${TELEMETRIA_TOKEN:-}
      TELEMETRIA_DASHBOARD: ${TELEMETRIA_DASHBOARD:-}
    ports:
      - "${PORT:-3100}:3100"

volumes:
  redetv-db:

# rede interna fixa: o Docker escolheria uma faixa 172.x, que pode bater com a rede da FPA
# (o Grafana da telemetria fica em 172.20.0.250). Mude no .env com REDETV_SUBNET se precisar.
networks:
  default:
    ipam:
      config:
        - subnet: ${REDETV_SUBNET:-192.168.203.0/24}
